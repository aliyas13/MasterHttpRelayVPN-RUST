name: Build for OpenWrt ARMv7 (musl)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf

      - name: Install cross
        run: cargo install cross --debug

      - name: Build with cross
        run: cross build --release --target armv7-unknown-linux-musleabihf

      - name: List built files
        run: ls -lah target/armv7-unknown-linux-musleabihf/release/

      - name: Upload artifact (all binaries)
        uses: actions/upload-artifact@v4
        with:
          name: mhrv-armv7-openwrt
          path: target/armv7-unknown-linux-musleabihf/release/mhrv*
